<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA RADIO — Live Stream</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #080a12;
            --card-bg: rgba(18, 22, 40, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-primary: #6366f1;
            --accent-secondary: #ec4899;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Blurred Background Artwork */
        .bg-artwork {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.25) saturate(140%);
            z-index: 0;
            transition: background-image 1s ease-in-out;
        }

        /* Glassmorphism Main Container */
        .player-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid var(--card-border);
            border-radius: 36px;
            padding: 32px 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        /* Top Header */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .station-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .station-name {
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Vinyl & Artwork Display */
        .artwork-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 28px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-record {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #111 20%, #222 30%, #111 40%, #222 60%, #050505 70%);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            top: 10px;
            right: 0px;
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .is-playing .vinyl-record {
            transform: translateX(38px);
            animation: spinVinyl 6s linear infinite;
        }

        @keyframes spinVinyl {
            0% { transform: translateX(38px) rotate(0deg); }
            100% { transform: translateX(38px) rotate(360deg); }
        }

        .album-art {
            width: 210px;
            height: 210px;
            border-radius: 26px;
            object-fit: cover;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6),
                        0 0 35px var(--accent-glow);
            position: relative;
            z-index: 2;
            background: #1e293b;
            transition: transform 0.3s ease;
        }

        /* Track Info */
        .track-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 1.35rem;
            font-weight: 800;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .track-artist {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Spectrum Equalizer Canvas */
        .visualizer-container {
            width: 100%;
            height: 48px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#spectrum {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        /* Control Bar */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .play-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), #a855f7, var(--accent-secondary));
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 10px 30px var(--accent-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 14px 40px rgba(168, 85, 247, 0.6);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 18px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .volume-icon {
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-primary);
        }

        /* Footer Info */
        .player-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .listeners-count {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .history-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body>

    <!-- Background Artwork Layer -->
    <div class="bg-artwork" id="bgArtwork"></div>

    <div class="player-container" id="playerCard">
        <!-- Header -->
        <div class="player-header">
            <div class="station-brand">
                <div class="brand-logo"><i class="fa-solid fa-radio"></i></div>
                <div class="station-name" id="stationName">AURA RADIO</div>
            </div>
            <div class="live-status">
                <div class="live-dot"></div> LIVE
            </div>
        </div>

        <!-- Vinyl Artwork Container -->
        <div class="artwork-wrapper">
            <div class="vinyl-record"></div>
            <img src="https://via.placeholder.com/210/1e293b/6366f1?text=AURA+RADIO" alt="Album Art" class="album-art" id="albumArt">
        </div>

        <!-- Track Info -->
        <div class="track-info">
            <div class="track-title" id="songTitle">AzuraCast Web Radio</div>
            <div class="track-artist" id="songArtist">Live Stream</div>
        </div>

        <!-- Spectrum Visualizer -->
        <div class="visualizer-container">
            <canvas id="spectrum"></canvas>
        </div>

        <!-- Play Controls -->
        <div class="controls-row">
            <button class="play-btn" id="playBtn" title="Play / Pause">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>

            <div class="volume-container">
                <i class="fa-solid fa-volume-high volume-icon" id="volumeIcon"></i>
                <input type="range" min="0" max="1" step="0.01" value="0.9" class="volume-slider" id="volumeSlider">
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="player-footer">
            <div class="listeners-count">
                <i class="fa-solid fa-users" style="color: var(--accent-primary);"></i> 
                <span id="listenerCount">0</span> Listeners
            </div>
            <button class="history-btn" onclick="location.href='/public/azuratest_radio'">
                <i class="fa-solid fa-compact-disc"></i> Station Page
            </button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="radioAudio" preload="none"></audio>

    <script>
        const API_URL = '/api/nowplaying/1';
        let rawStreamUrl = '/listen/azuratest_radio/radio.mp3?stream=true';

        const playerCard = document.getElementById('playerCard');
        const bgArtwork = document.getElementById('bgArtwork');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const radioAudio = document.getElementById('radioAudio');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');

        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const albumArt = document.getElementById('albumArt');
        const listenerCount = document.getElementById('listenerCount');
        const stationName = document.getElementById('stationName');

        let isPlaying = false;
        let audioCtx, analyser, dataArray, canvas, ctx;

        // Ensure volume starts loud & clear
        radioAudio.volume = 0.9;

        async function fetchNowPlaying() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) return;
                const data = await res.json();

                if (data.station && data.station.name) {
                    stationName.textContent = data.station.name.toUpperCase();
                }

                if (data.now_playing && data.now_playing.song) {
                    songTitle.textContent = data.now_playing.song.title || 'Live Stream';
                    songArtist.textContent = data.now_playing.song.artist || 'AzuraCast Radio';
                    if (data.now_playing.song.art) {
                        albumArt.src = data.now_playing.song.art;
                        bgArtwork.style.backgroundImage = `url('${data.now_playing.song.art}')`;
                    }
                }

                if (data.listeners) {
                    listenerCount.textContent = data.listeners.current || 0;
                }

                if (data.station && data.station.listen_url) {
                    let url = data.station.listen_url;
                    if (!url.includes('stream=true')) {
                        url += (url.includes('?') ? '&' : '?') + 'stream=true';
                    }
                    rawStreamUrl = url;
                }
            } catch (err) {
                console.log('API Fetch Error:', err);
            }
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                // Resume Audio Context if suspended
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // Connect stream
                radioAudio.src = rawStreamUrl + '&t=' + Date.now();
                radioAudio.load();
                
                const playPromise = radioAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        playIcon.className = 'fa-solid fa-pause';
                        playerCard.classList.add('is-playing');
                        initVisualizer();
                    }).catch(err => {
                        console.error('Playback failed:', err);
                        alert('Could not start stream audio. Please make sure your browser allows audio playback.');
                    });
                }
            } else {
                radioAudio.pause();
                radioAudio.src = ''; // disconnect stream on pause
                isPlaying = false;
                playIcon.className = 'fa-solid fa-play';
                playerCard.classList.remove('is-playing');
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            radioAudio.volume = e.target.value;
            if (e.target.value == 0) {
                volumeIcon.className = 'fa-solid fa-volume-xmark';
            } else if (e.target.value < 0.5) {
                volumeIcon.className = 'fa-solid fa-volume-low';
            } else {
                volumeIcon.className = 'fa-solid fa-volume-high';
            }
        });

        function initVisualizer() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(radioAudio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                canvas = document.getElementById('spectrum');
                ctx = canvas.getContext('2d');

                function renderFrame() {
                    requestAnimationFrame(renderFrame);
                    analyser.getByteFrequencyData(dataArray);

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const barWidth = (canvas.width / bufferLength) * 1.5;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * canvas.height;
                        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                        gradient.addColorStop(0, '#6366f1');
                        gradient.addColorStop(1, '#ec4899');

                        ctx.fillStyle = gradient;
                        ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
                        x += barWidth;
                    }
                }
                renderFrame();
            } catch (e) {
                console.log('Visualizer AudioContext:', e);
            }
        }

        fetchNowPlaying();
        setInterval(fetchNowPlaying, 10000);
    </script>
</body>
</html>
